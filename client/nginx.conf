server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the Flask backend (the /api prefix is preserved)
    location /api/ {
        proxy_pass http://game-backend:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # React Router (BrowserRouter): serve index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }
}
