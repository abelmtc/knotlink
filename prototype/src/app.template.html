<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnotLink Strategy Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream-50:#f8faf7; --cream-100:#f0f4ef; --sage-50:#eaf1fb; --sage-100:#d9e6f8; --sage-200:#b4cded; --sage-400:#7f9cc4;
    --moss-500:#5a7396; --moss-600:#344966; --moss-700:#2a3b54; --forest-800:#1b2a3b; --forest-900:#0d1821;
    --honey-100:#e9efd3; --honey-400:#bfcc94; --honey-500:#93a45f; --berry-600:#a94f4a; --berry-100:#f6e3e1;
    --radius:16px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--cream-100); color:var(--forest-900); font-family:"DM Sans",system-ui,sans-serif; line-height:1.5; }
  h1,h2,h3 { font-family:"Fraunces",Georgia,serif; letter-spacing:-.01em; margin:0; font-weight:600; }
  button { font:inherit; }
  header { position:sticky; top:0; z-index:20; background:rgba(248,250,247,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--sage-200); }
  .bar { max-width:1240px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; padding:10px 18px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:"Fraunces",serif; font-size:1.45rem; font-weight:600; }
  .brand small { font-family:"DM Sans"; font-size:.78rem; font-weight:500; color:var(--moss-500); letter-spacing:.12em; text-transform:uppercase; }
  nav { display:flex; flex-wrap:wrap; gap:4px; margin-left:auto; }
  nav a { padding:6px 14px; border-radius:999px; color:var(--forest-800); text-decoration:none; font-weight:500; }
  nav a:hover { background:var(--sage-100); }
  nav a.active { background:var(--moss-600); color:var(--cream-50); }
  main { max-width:1240px; margin:0 auto; padding:24px 18px 60px; }
  .lede { color:var(--moss-600); max-width:780px; margin:6px 0 18px; }
  .card { background:var(--cream-50); border:1px solid var(--sage-200); border-radius:var(--radius); box-shadow:0 1px 2px rgba(13,24,33,.05); }
  .pad { padding:18px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 16px; border-radius:999px; border:1.5px solid var(--moss-600); background:var(--cream-50); color:var(--moss-700); font-weight:600; cursor:pointer; transition:background .15s, transform .1s; }
  .btn:hover:not(:disabled) { background:var(--sage-100); }
  .btn:active:not(:disabled) { transform:translateY(1px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.primary { background:var(--moss-600); color:var(--cream-50); }
  .btn.primary:hover:not(:disabled) { background:var(--moss-700); }
  .btn.warm { background:var(--honey-400); border-color:var(--honey-400); color:var(--forest-900); }
  .btn.small { padding:4px 11px; font-size:.86rem; }
  .btn.block { width:100%; }
  .seg { display:flex; border:1.5px solid var(--sage-400); border-radius:999px; padding:2px; background:var(--cream-50); }
  .seg button { flex:1; border:0; background:transparent; padding:6px 10px; border-radius:999px; font-weight:600; color:var(--forest-800); cursor:pointer; font-size:.9rem; }
  .seg button[aria-pressed="true"] { background:var(--moss-600); color:var(--cream-50); }
  label.f { display:flex; flex-direction:column; gap:5px; font-size:.86rem; font-weight:500; color:var(--moss-600); }
  select, input[type=text], textarea { font:inherit; padding:7px 10px; border-radius:10px; border:1.5px solid var(--sage-400); background:var(--cream-50); color:var(--forest-900); }
  textarea { font-family:ui-monospace,Menlo,monospace; font-size:.82rem; }
  .muted { color:var(--moss-500); font-size:.88rem; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:600; border:1px solid var(--sage-200); background:var(--sage-50); color:var(--forest-800); white-space:nowrap; }
  .pill.k { background:var(--berry-100); border-color:#e4b9b5; color:#6b2b27; }
  .pill.u { background:var(--honey-100); border-color:var(--honey-400); color:#3f4a1b; }
  .pill.flip { background:var(--moss-600); border-color:var(--moss-600); color:var(--cream-50); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .grid-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .kcard { cursor:pointer; overflow:hidden; display:flex; flex-direction:column; transition:transform .12s, box-shadow .12s; }
  .kcard:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(13,24,33,.12); }
  .kcard .thumb { background:#fff; border-bottom:1px solid var(--sage-200); height:150px; display:flex; align-items:center; justify-content:center; padding:10px; }
  .kcard .thumb svg { max-width:100%; max-height:130px; }
  .kcard .body { padding:12px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .kcard .fam { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--moss-500); font-weight:600; }
  .kcard h3 { font-size:1.08rem; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--sage-200); vertical-align:middle; }
  th { font-size:.76rem; text-transform:uppercase; letter-spacing:.08em; color:var(--moss-500); font-weight:600; background:var(--cream-100); position:sticky; top:0; }
  tbody tr.click { cursor:pointer; }
  tbody tr.click:hover { background:var(--sage-50); }
  .tablewrap { overflow:auto; max-height:70vh; }
  .playgrid { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start; }
  @media (max-width:900px) { .playgrid { grid-template-columns:1fr; } }
  .boardwrap { position:relative; background:#fff; border-radius:var(--radius); border:1px solid var(--sage-200); padding:14px; display:flex; justify-content:center; }
  .boardwrap svg { width:100%; height:auto; max-height:72vh; }
  .side { display:flex; flex-direction:column; gap:14px; position:sticky; top:76px; }
  .side h2 { font-size:1.2rem; }
  .stat2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { border:1px solid var(--sage-200); border-radius:12px; padding:8px 10px; background:var(--sage-50); }
  .stat .l { font-size:.74rem; color:var(--moss-500); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .stat .v { font-weight:700; font-size:1.02rem; }
  .theory td, .theory th { padding:6px 8px; font-size:.86rem; background:transparent; position:static; }
  .alert { padding:10px 12px; border-radius:12px; border:1.5px solid var(--sage-400); background:var(--sage-100); font-size:.9rem; }
  .alert.bad { border-color:var(--berry-600); background:var(--berry-100); color:#6b2b27; }
  .alert.good { border-color:var(--honey-500); background:var(--honey-100); color:#3f4a1b; }
  .turn { display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .dot.k { background:var(--berry-600); } .dot.u { background:var(--honey-500); }
  .log { max-height:200px; overflow:auto; font-size:.84rem; padding-left:20px; margin:0; }
  .log li { margin:2px 0; }
  .pop { position:absolute; z-index:5; background:var(--cream-50); border:1.5px solid var(--moss-600); border-radius:14px; padding:10px; box-shadow:0 10px 30px rgba(13,24,33,.22); display:flex; flex-direction:column; gap:8px; min-width:210px; }
  .pop .opts { display:flex; gap:8px; }
  .pop .opt { flex:1; border:1.5px solid var(--sage-400); border-radius:10px; background:#fff; padding:6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.78rem; font-weight:600; }
  .pop .opt:hover { border-color:var(--honey-500); background:var(--honey-100); }
  .xc { cursor:pointer; }
  .xc:hover circle.ring { stroke-width:.1; }
  .modal { position:fixed; inset:0; background:rgba(13,24,33,.55); z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; }
  .modal .card { width:min(960px,100%); max-height:94vh; display:flex; flex-direction:column; }
  .modal canvas { width:100%; height:min(68vh,620px); display:block; background:radial-gradient(circle at 50% 40%, #ffffff, var(--sage-50)); border-radius:12px; cursor:grab; touch-action:none; }
  .hero { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; margin-bottom:22px; }
  @media (max-width:900px) { .hero { grid-template-columns:1fr; } }
  .callout { background:var(--forest-800); color:var(--cream-50); border-radius:var(--radius); padding:18px 20px; }
  .callout h3 { font-size:1.1rem; margin-bottom:6px; }
  .callout p { margin:6px 0; color:#d8e2ee; font-size:.93rem; }
  .bars { display:flex; flex-direction:column; gap:6px; }
  .barrow { display:grid; grid-template-columns:130px 1fr 52px; gap:8px; align-items:center; font-size:.85rem; }
  .bartrack { background:var(--sage-100); border-radius:6px; height:14px; overflow:hidden; }
  .barfill { background:var(--moss-600); height:100%; border-radius:6px; }
  .empty { text-align:center; padding:30px; color:var(--moss-500); }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--sage-200); border-top-color:var(--moss-600); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .prose p, .prose li { max-width:820px; }
  .prose h2 { margin:22px 0 8px; font-size:1.3rem; }
  code { background:var(--sage-50); padding:1px 5px; border-radius:5px; font-size:.86em; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.8rem; color:var(--moss-600); margin-top:8px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 C78 12 92 46 70 66 C52 82 26 70 22 50 C18 28 46 16 62 34 C76 50 70 78 48 86 C28 92 10 74 18 54" fill="none" stroke="#344966" stroke-width="9" stroke-linecap="round"/></svg>
      <div>KnotLink <small>Strategy Lab</small></div>
    </div>
    <nav id="nav">
      <a href="#catalog" data-r="catalog">Knot catalog</a>
      <a href="#play" data-r="play">Play</a>
      <a href="#atlas" data-r="atlas">First-mover atlas</a>
      <a href="#data" data-r="data">Experiment data</a>
      <a href="#about" data-r="about">About</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="modal-root"></div>

<script type="module">
/*ENGINE*/

// =============================================================================================
// App state
const S = {
  catalog: buildCatalog(),
  analysis: new Map(),     // id -> analyzeShadow result (+ difficulty)
  filter: 'All', view: 'cards',
  cur: null,               // current game session
  setup: { first: 'knotter', mode: 'winning', role: 'knotter', strict: true },
  customBoard: null,
  session: [],             // game records from this visit
  db: null, uid: null, label: '', dbStatus: 'connecting',
  remote: null,            // loaded records from db (owner view)
};
const byId = (id) => S.catalog.find((e) => e.id === id);
const FAMILIES = ['All', ...new Set(S.catalog.map((e) => e.family))];
const NAME = { knotter: 'Knotter', unknotter: 'Unknotter' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const pct = (x) => `${Math.round(x * 100)}%`;
const median = (xs) => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

// Per-board analysis (cached).  difficulty = share of opening moves that keep the theoretical
// winner winning (lower share = fewer correct openings = harder to find).
function analysisOf(entry) {
  if (S.analysis.has(entry.id)) return S.analysis.get(entry.id);
  const a = analyzeShadow(entry.board);
  if (a.ok) {
    const g = createGame(entry.board);
    for (const first of ['knotter', 'unknotter']) {
      const ev = evaluateMoves(g, new Array(g.n).fill(0), first);
      a[`openShare_${first}`] = ev.mover === ev.winnerNow ? ev.moves.filter((m) => m.winning).length / ev.moves.length : null;
    }
    a.density = entry.crossings / (entry.rows * entry.cols);
  }
  S.analysis.set(entry.id, a);
  return a;
}

// =============================================================================================
// Mosaic rendering (SVG)
const MID = [[0.5, 0], [1, 0.5], [0.5, 1], [0, 0.5]];
const TPAIRS = { 1: [[3, 2]], 2: [[1, 2]], 3: [[0, 1]], 4: [[3, 0]], 5: [[3, 1]], 6: [[0, 2]], 7: [[2, 3], [0, 1]], 8: [[2, 1], [3, 0]] };
function segPath(x, y, a, b) {
  const [ax, ay] = MID[a], [bx, by] = MID[b];
  if ((a + 2) % 4 === b) return `M${x + ax} ${y + ay}L${x + bx} ${y + by}`;
  return `M${x + ax} ${y + ay}Q${x + 0.5} ${y + 0.5} ${x + bx} ${y + by}`;
}
// opts: { interactive, playMap: Map(r*C+c -> j), hints:Set(j), last:{r,c}, pending:{r,c}, stroke, grid }
function mosaicSVG(board, opts = {}) {
  const R = board.length, C = board[0].length, sw = opts.stroke || 0.13;
  const ink = '#0d1821', halo = '#ffffff';
  let under = '', over = '', marks = '', grid = '';
  if (opts.grid) {
    for (let r = 0; r <= R; r++) grid += `M0 ${r}H${C}`;
    for (let c = 0; c <= C; c++) grid += `M${c} 0V${R}`;
  }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const t = board[r][c];
    if (TPAIRS[t]) { for (const [a, b] of TPAIRS[t]) under += segPath(c, r, a, b); continue; }
    if (t === 9 || t === 10) {
      const lo = t === 9 ? [0, 2] : [3, 1], hi = t === 9 ? [3, 1] : [0, 2];
      under += segPath(c, r, lo[0], lo[1]);
      over += `<path d="${segPath(c, r, hi[0], hi[1])}" stroke="${halo}" stroke-width="${sw * 3.2}"/><path d="${segPath(c, r, hi[0], hi[1])}" stroke="${ink}" stroke-width="${sw}"/>`;
    } else if (t === -1) {
      under += segPath(c, r, 0, 2) + segPath(c, r, 3, 1);
      const j = opts.playMap ? opts.playMap.get(r * C + c) : undefined;
      const hint = opts.hints && j !== undefined && opts.hints.has(j);
      const pend = opts.pending && opts.pending.r === r && opts.pending.c === c;
      const ringColor = pend ? '#344966' : hint ? '#5f7d1e' : '#93a45f';
      const cls = opts.interactive && j !== undefined ? ' class="xc" data-j="' + j + '"' : '';
      marks += `<g${cls}><circle cx="${c + 0.5}" cy="${r + 0.5}" r="0.36" fill="${hint ? 'rgba(191,204,148,.55)' : 'rgba(191,204,148,.28)'}"/><circle class="ring" cx="${c + 0.5}" cy="${r + 0.5}" r="0.36" fill="none" stroke="${ringColor}" stroke-width="${pend || hint ? 0.09 : 0.055}"/>${opts.labels && j !== undefined ? `<text x="${c + 0.5}" y="${r + 0.5}" font-size="0.32" text-anchor="middle" dominant-baseline="central" fill="#2a3b54" font-weight="700" style="pointer-events:none">${j + 1}</text>` : ''}</g>`;
    }
    if (opts.last && opts.last.r === r && opts.last.c === c) marks += `<rect x="${c + 0.06}" y="${r + 0.06}" width="0.88" height="0.88" rx="0.18" fill="none" stroke="#a94f4a" stroke-width="0.06" stroke-dasharray="0.12 0.08"/>`;
  }
  const pad = 0.15;
  return `<svg viewBox="${-pad} ${-pad} ${C + 2 * pad} ${R + 2 * pad}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Knot mosaic ${R} by ${C}">
    ${opts.grid ? `<path d="${grid}" stroke="#d9e6f8" stroke-width="0.02" fill="none"/>` : ''}
    <g fill="none" stroke-linecap="round"><path d="${under}" stroke="${ink}" stroke-width="${sw}"/>${over}</g>${marks}</svg>`;
}
function alternatingBoard(entry) {
  const d = buildDiagram(entry.board);
  const b = entry.board.map((r) => r.slice());
  if (d.altTile) d.crossings.forEach((x, i) => { b[x.r][x.c] = d.altTile[i]; });
  return b;
}
function tileIcon(t) { return mosaicSVG([[t]], { stroke: 0.16 }).replace('<svg ', '<svg width="44" height="44" '); }

// =============================================================================================
// Router
const ROUTES = { catalog: viewCatalog, play: viewPlay, atlas: viewAtlas, data: viewData, about: viewAbout };
function route() {
  const r = (location.hash || '#catalog').slice(1);
  const name = ROUTES[r] ? r : 'catalog';
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.r === name));
  ROUTES[name]();
}
window.addEventListener('hashchange', route);
function go(r) { if (location.hash === '#' + r) route(); else location.hash = r; }

// =============================================================================================
// Catalog
function viewCatalog() {
  const list = S.catalog.filter((e) => S.filter === 'All' || e.family === S.filter);
  $('#app').innerHTML = `
    <div class="hero">
      <div>
        <h1>Pick a knot shadow, then play it</h1>
        <p class="lede">Each picture is a knot drawn as a mosaic. Click one to open it as a game board: the over/under information is erased and two players take turns choosing it, one crossing at a time. The <b>Knotter</b> wants the finished diagram to be knotted, the <b>Unknotter</b> wants it to come apart.</p>
        <div class="legend"><span><span class="pill k">K</span> Knotter wins</span><span><span class="pill u">U</span> Unknotter wins</span><span><span class="pill flip">order matters</span> the first mover changes the winner</span><span>Prior: share of all resolutions that are knotted</span></div>
      </div>
      <div class="callout">
        <h3>The questions for this prototype</h3>
        <p>Does it matter who goes first? Which player has the winning strategy on each family (twist, torus, 2-bridge, pretzel, dense mosaics)?</p>
        <p>When a human is handed the winning side against the AI, which knot structures do people actually manage to play correctly?</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Family" style="flex-wrap:wrap">${FAMILIES.map((f) => `<button data-f="${esc(f)}" aria-pressed="${S.filter === f}">${esc(f)}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="View" style="margin-left:auto">
        <button data-v="cards" aria-pressed="${S.view === 'cards'}">Pictures</button><button data-v="list" aria-pressed="${S.view === 'list'}">List</button>
      </div>
    </div>
    <div id="catbody"></div>`;
  $('#app').querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { S.filter = b.dataset.f; viewCatalog(); });
  $('#app').querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { S.view = b.dataset.v; viewCatalog(); });
  const body = $('#catbody');
  const badges = (a) => a && a.ok ? `
      <span class="pill ${a.winnerIfKnotterFirst === 'knotter' ? 'k' : 'u'}" title="Knotter moves first">K first → ${a.winnerIfKnotterFirst === 'knotter' ? 'K' : 'U'}</span>
      <span class="pill ${a.winnerIfUnknotterFirst === 'knotter' ? 'k' : 'u'}" title="Unknotter moves first">U first → ${a.winnerIfUnknotterFirst === 'knotter' ? 'K' : 'U'}</span>
      ${a.firstMoverMatters ? '<span class="pill flip">order matters</span>' : ''}` : '';
  if (S.view === 'cards') {
    body.innerHTML = `<div class="grid-cards">${list.map((e) => {
      const a = analysisOf(e);
      return `<div class="card kcard" data-id="${e.id}" tabindex="0" role="button" aria-label="Play ${esc(e.label)}">
        <div class="thumb">${mosaicSVG(alternatingBoard(e), { stroke: 0.16 })}</div>
        <div class="body"><div class="fam">${esc(e.family)}</div><h3>${esc(e.label)}</h3>
          <div class="muted">${e.crossings} crossing${e.crossings === 1 ? '' : 's'}${e.knot ? ` · ${esc(e.knot)}` : ''}${a && a.ok ? ` · prior ${pct(a.knottedFraction)} knotted` : ''}</div>
          <div class="row">${badges(a)}</div></div></div>`;
    }).join('')}</div>`;
  } else {
    body.innerHTML = `<div class="card tablewrap"><table><thead><tr><th>Shadow</th><th>Family</th><th>Crossings</th><th>Alternating knot</th><th>Prior (knotted)</th><th>Perfect play</th></tr></thead><tbody>
      ${list.map((e) => { const a = analysisOf(e); return `<tr class="click" data-id="${e.id}"><td><b>${esc(e.label)}</b></td><td>${esc(e.family)}</td><td>${e.crossings}</td><td>${esc(e.knot || (e.determinant ? `det ${e.determinant}` : '—'))}</td><td>${a.ok ? pct(a.knottedFraction) : '—'}</td><td><div class="row">${badges(a)}</div></td></tr>`; }).join('')}
      </tbody></table></div>`;
  }
  body.querySelectorAll('[data-id]').forEach((el) => {
    el.onclick = () => openBoard(el.dataset.id);
    el.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openBoard(el.dataset.id); } };
  });
}

function openBoard(id) {
  const entry = id === 'custom' ? S.customBoard : byId(id);
  stopAI();
  S.cur = { entry, game: createGame(entry.board), started: false };
  go('play');
}

// =============================================================================================
// Play
function stopAI() { if (S.cur && S.cur.aiTimer) { clearTimeout(S.cur.aiTimer); S.cur.aiTimer = null; } }

function currentBoard(cur) {
  const b = cur.entry.board.map((r) => r.slice());
  if (cur.assign) cur.assign.forEach((t, j) => { if (t) { const x = cur.game.diag.crossings[cur.game.playable[j]]; b[x.r][x.c] = t; } });
  return b;
}
function playMap(game) { const m = new Map(); game.playable.forEach((i, j) => { const x = game.diag.crossings[i]; m.set(x.r * game.diag.C + x.c, j); }); return m; }

function viewPlay() {
  if (!S.cur) S.cur = { entry: byId('twist-2'), game: createGame(byId('twist-2').board), started: false };
  const cur = S.cur, e = cur.entry;
  if (!cur.game.ok) {
    $('#app').innerHTML = `<div class="card pad"><h2>${esc(e.label)}</h2><div class="alert bad" style="margin-top:10px">${cur.game.errors.map(esc).join('<br>')}</div><p><button class="btn" onclick="location.hash='catalog'">Back to catalog</button></p></div>`;
    return;
  }
  $('#app').innerHTML = `
    <div class="playgrid">
      <section>
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <div><div class="muted" style="text-transform:uppercase;letter-spacing:.1em;font-weight:600;font-size:.74rem">${esc(e.family)}</div><h1 style="font-size:1.7rem">${esc(e.label)}</h1></div>
          <div class="row"><button class="btn small" id="b3d">View in 3D</button><a class="btn small" href="#catalog">Catalog</a></div>
        </div>
        <div class="boardwrap" id="boardwrap"></div>
        <div class="legend"><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="rgba(191,204,148,.4)" stroke="#93a45f" stroke-width="1.5"/></svg> unresolved crossing (click to play)</span><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="rgba(191,204,148,.7)" stroke="#5f7d1e" stroke-width="2.5"/></svg> hint: a winning move</span><span><svg width="16" height="16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="#a94f4a" stroke-width="1.5" stroke-dasharray="3 2"/></svg> last move</span></div>
      </section>
      <aside class="side" id="side"></aside>
    </div>`;
  $('#b3d').onclick = () => open3D(currentBoard(cur));
  renderBoard(); renderSide();
}

function renderBoard() {
  const cur = S.cur, wrap = $('#boardwrap'); if (!wrap) return;
  const humanTurn = cur.started && !cur.over && isHuman(cur, moverOf(cur.assign, cur.first));
  wrap.innerHTML = mosaicSVG(currentBoard(cur), {
    interactive: humanTurn, playMap: playMap(cur.game), hints: cur.showHints ? cur.hintSet : null,
    last: cur.last, pending: cur.pending, grid: true, labels: true,
  });
  if (humanTurn) wrap.querySelectorAll('.xc').forEach((g) => g.addEventListener('click', (ev) => choose(Number(g.dataset.j), ev)));
  if (cur.pending) showPopover();
}

function isHuman(cur, role) { return cur.humans.includes(role); }

function theoryTable(a) {
  if (!a || !a.ok) return '';
  const cell = (w) => `<span class="pill ${w === 'knotter' ? 'k' : 'u'}">${NAME[w]}</span>`;
  return `<table class="theory"><thead><tr><th>Who moves first</th><th>Wins with perfect play</th></tr></thead><tbody>
    <tr><td>Knotter (P1 = K)</td><td>${cell(a.winnerIfKnotterFirst)}</td></tr>
    <tr><td>Unknotter (P1 = U)</td><td>${cell(a.winnerIfUnknotterFirst)}</td></tr></tbody></table>
    <div class="muted" style="margin-top:6px">${a.firstMoverMatters ? '<b>Order matters here:</b> whoever moves first decides the winner.' : `Order does not matter: the <b>${NAME[a.winnerIfKnotterFirst]}</b> wins either way.`} ${(a.knottedFraction * 100).toFixed(1)}% of all ${2 ** a.playable} resolutions are knotted.</div>`;
}

function renderSide() {
  const cur = S.cur, side = $('#side'); if (!side) return;
  const a = cur.entry.id === 'custom' ? analyzeShadow(cur.entry.board) : analysisOf(cur.entry);
  const info = `<div class="card pad"><div class="stat2">
      <div class="stat"><div class="l">Crossings</div><div class="v">${cur.game.diag.N} <span class="muted">(${cur.game.n} to play)</span></div></div>
      <div class="stat"><div class="l">Alternating knot</div><div class="v">${esc(cur.entry.knot || (cur.entry.determinant ? 'det ' + cur.entry.determinant : '—'))}</div></div>
    </div><div style="margin-top:12px">${theoryTable(a)}</div></div>`;
  if (!cur.started) {
    const st = S.setup;
    const W = a.ok ? (st.first === 'knotter' ? a.winnerIfKnotterFirst : a.winnerIfUnknotterFirst) : null;
    side.innerHTML = info + `<div class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <h2>New game</h2>
      <label class="f">Who moves first (P1)?<div class="seg" id="sfirst"><button data-v="knotter" aria-pressed="${st.first === 'knotter'}">Knotter</button><button data-v="unknotter" aria-pressed="${st.first === 'unknotter'}">Unknotter</button></div></label>
      <label class="f">Mode<select id="smode">
        <option value="winning" ${st.mode === 'winning' ? 'selected' : ''}>Human takes the winning side vs AI</option>
        <option value="choose" ${st.mode === 'choose' ? 'selected' : ''}>Choose my side vs AI</option>
        <option value="hotseat" ${st.mode === 'hotseat' ? 'selected' : ''}>Two humans (hot seat)</option>
        <option value="watch" ${st.mode === 'watch' ? 'selected' : ''}>Watch AI vs AI</option></select></label>
      ${st.mode === 'choose' ? `<label class="f">My side<div class="seg" id="srole"><button data-v="knotter" aria-pressed="${st.role === 'knotter'}">Knotter</button><button data-v="unknotter" aria-pressed="${st.role === 'unknotter'}">Unknotter</button></div></label>` : ''}
      ${st.mode === 'winning' || st.mode === 'choose' ? `<label class="f">Coaching<div class="seg" id="sstrict"><button data-v="1" aria-pressed="${st.strict}">Strict: must play winning moves</button><button data-v="0" aria-pressed="${!st.strict}">Free</button></div></label>
      <div class="muted">${st.strict ? 'Strict: a move that throws away the win is rejected and logged as an error; try again.' : 'Free: mistakes stand, and the AI will punish them.'}</div>` : ''}
      ${st.mode === 'winning' && W ? `<div class="alert good">With ${NAME[st.first]} first, the <b>${NAME[W]}</b> has the winning strategy, so <b>you play ${NAME[W]}</b> and the AI defends the losing side.</div>` : ''}
      <label class="f">Participant label (optional, for the experiment log)<input type="text" id="slabel" value="${esc(S.label)}" placeholder="e.g. P07"></label>
      <button class="btn primary block" id="sstart">Start game</button>
      <details><summary class="muted" style="cursor:pointer">Load a custom board</summary>
        <p class="muted">Paste rows of tile numbers (Mosaic Maker export works). Use -1 or 11 for unresolved crossings; resolved 9/10 stay fixed.</p>
        <textarea id="scustom" rows="6" style="width:100%" placeholder="[[0,2,1,0],[2,-1,-1,1],[3,-1,8,4],[0,3,4,0]]"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn small" id="sload">Load board</button><span id="serr" class="muted"></span></div>
      </details></div>`;
    side.querySelectorAll('#sfirst button').forEach((b) => b.onclick = () => { st.first = b.dataset.v; renderSide(); });
    side.querySelectorAll('#srole button').forEach((b) => b.onclick = () => { st.role = b.dataset.v; renderSide(); });
    side.querySelectorAll('#sstrict button').forEach((b) => b.onclick = () => { st.strict = b.dataset.v === '1'; renderSide(); });
    $('#smode').onchange = (ev) => { st.mode = ev.target.value; renderSide(); };
    $('#slabel').oninput = (ev) => { S.label = ev.target.value.trim(); };
    $('#sstart').onclick = () => startGame(W);
    $('#sload').onclick = () => {
      try {
        const txt = $('#scustom').value.trim();
        const board = normalizeBoard(txt.includes('[[') ? txt : '[' + txt.replace(/\]\s*\[/g, '],[') + ']');
        const errs = validateBoard(board);
        if (errs.length) throw new Error(errs.slice(0, 3).join('; '));
        const d = buildDiagram(board);
        const inv = alternatingInvariants(d);
        S.customBoard = { id: 'custom', family: 'Custom', label: 'Custom board', board, crossings: d.N, knot: '', determinant: inv ? inv.determinant : null, rows: board.length, cols: board[0].length };
        openBoard('custom');
      } catch (err) { $('#serr').textContent = err.message; }
    };
    return;
  }
  const mover = cur.over ? null : moverOf(cur.assign, cur.first);
  const humanTurn = mover && isHuman(cur, mover);
  const youAre = cur.mode === 'hotseat' ? 'Two humans' : cur.mode === 'watch' ? 'AI vs AI' : `You are the <b>${NAME[cur.humans[0]]}</b>`;
  let status = '';
  if (cur.over) {
    const f = cur.final;
    const humanWon = cur.humans.length === 1 ? cur.winner === cur.humans[0] : null;
    status = `<div class="alert ${humanWon === false ? 'bad' : 'good'}"><b>${NAME[cur.winner]} wins.</b> The diagram is ${f.is_unknot ? 'the <b>unknot</b>' : 'a <b>knot</b>'}.<br><span class="muted">Jones polynomial: ${esc(f.jones_polynomial)}${f.determinant != null ? ` · det ${f.determinant}` : ''}</span>${cur.mode !== 'hotseat' && cur.mode !== 'watch' ? `<br>${cur.errors} rejected/losing move${cur.errors === 1 ? '' : 's'} · ${cur.hints} hint${cur.hints === 1 ? '' : 's'}` : ''}</div>`;
  } else {
    status = `<div class="turn"><span class="dot ${mover === 'knotter' ? 'k' : 'u'}"></span>${NAME[mover]} to move ${humanTurn ? '<span class="pill">your turn</span>' : '<span class="spinner"></span>'}</div>
      ${cur.flash ? `<div class="alert ${cur.flash.kind}">${cur.flash.text}</div>` : ''}
      <div class="muted">${humanTurn ? 'Click a highlighted crossing, then choose which strand goes over.' : cur.mode === 'watch' ? 'Watching perfect play by both sides.' : 'The AI is choosing…'}</div>`;
  }
  side.innerHTML = info + `<div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between"><h2>Game</h2><span class="muted">${youAre} · P1 = ${NAME[cur.first]}</span></div>
      ${status}
      <div class="row">
        ${!cur.over && humanTurn && cur.mode !== 'hotseat' ? `<button class="btn small" id="bhint">${cur.showHints ? 'Hide hint' : 'Hint'}</button>` : ''}
        ${!cur.over && cur.mode === 'hotseat' ? `<button class="btn small" id="bhint">${cur.showHints ? 'Hide hints' : 'Show winning moves'}</button>` : ''}
        <button class="btn small" id="brestart">${cur.over ? 'Play again' : 'Restart'}</button>
        <button class="btn small" id="bnew">New setup</button>
      </div>
      <div><div class="muted" style="font-weight:600">Moves</div><ol class="log">${cur.log.map((l) => `<li>${l}</li>`).join('') || '<li class="muted">No moves yet</li>'}</ol></div>
    </div>`;
  const bh = $('#bhint'); if (bh) bh.onclick = () => { cur.showHints = !cur.showHints; if (cur.showHints) { cur.hints++; cur.hintUsedThisMove = true; } renderBoard(); renderSide(); };
  $('#brestart').onclick = () => { stopAI(); startGame(cur.theory); };
  $('#bnew').onclick = () => { stopAI(); S.cur = { entry: cur.entry, game: cur.game, started: false }; viewPlay(); };
}

function startGame(W) {
  const cur = S.cur, st = S.setup;
  stopAI();
  const theoryW = theoreticalWinner(cur.game, st.first);
  let humans;
  if (st.mode === 'winning') humans = [theoryW];
  else if (st.mode === 'choose') humans = [st.role];
  else if (st.mode === 'hotseat') humans = ['knotter', 'unknotter'];
  else humans = [];
  Object.assign(cur, {
    started: true, over: false, first: st.first, mode: st.mode, strict: st.strict && (st.mode === 'winning' || st.mode === 'choose'),
    humans, theory: theoryW, assign: new Array(cur.game.n).fill(0), log: [], events: [], errors: 0, hints: 0,
    showHints: false, pending: null, last: null, flash: null, t0: Date.now(), turnStart: Date.now(),
    gameId: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
  });
  refreshHints(); renderBoard(); renderSide(); maybeAI();
}

function refreshHints() {
  const cur = S.cur;
  if (cur.over) { cur.hintSet = new Set(); return; }
  const ev = evaluateMoves(cur.game, cur.assign, cur.first);
  cur.eval = ev;
  cur.hintSet = new Set(ev.moves.filter((m) => m.winning).map((m) => m.j));
}

function choose(j, ev) {
  const cur = S.cur;
  cur.pending = { j, ...(() => { const x = cur.game.diag.crossings[cur.game.playable[j]]; return { r: x.r, c: x.c }; })() };
  cur.popAt = { x: ev.clientX, y: ev.clientY };
  renderBoard();
}

function showPopover() {
  const cur = S.cur, wrap = $('#boardwrap');
  const rect = wrap.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'pop';
  const win = (t) => cur.showHints && cur.eval && cur.eval.moves.some((m) => m.j === cur.pending.j && m.tile === t && m.winning);
  const opt = (t, label) => `<button class="opt" data-t="${t}" ${win(t) ? 'style="border-color:#5f7d1e;background:var(--honey-100)"' : ''}>${tileIcon(t)}${label}${win(t) ? ' ✓' : ''}</button>`;
  pop.innerHTML = `<div style="font-weight:700">Crossing ${cur.pending.j + 1}: which strand goes over?</div>
    <div class="opts">${opt(9, 'Horizontal over')}${opt(10, 'Vertical over')}</div>
    <button class="btn small" data-t="0">Cancel</button>`;
  wrap.appendChild(pop);
  let x = cur.popAt.x - rect.left + 12, y = cur.popAt.y - rect.top + 12;
  x = Math.min(x, rect.width - 230); y = Math.min(y, rect.height - 150);
  pop.style.left = Math.max(6, x) + 'px'; pop.style.top = Math.max(6, y) + 'px';
  pop.querySelectorAll('[data-t]').forEach((b) => b.onclick = (e2) => {
    e2.stopPropagation();
    const t = Number(b.dataset.t), j = cur.pending.j;
    cur.pending = null;
    if (t) humanMove(j, t); else renderBoard();
  });
}

function describe(role, j, tile, extra = '') {
  return `<span class="dot ${role === 'knotter' ? 'k' : 'u'}"></span> ${NAME[role]}: crossing ${j + 1} → ${tile === 9 ? 'horizontal' : 'vertical'} over${extra}`;
}

function humanMove(j, tile) {
  const cur = S.cur;
  const mover = moverOf(cur.assign, cur.first);
  const ev = cur.eval;
  const m = ev.moves.find((x) => x.j === j && x.tile === tile);
  const nWin = ev.moves.filter((x) => x.winning).length;
  const event = {
    moveNo: cur.assign.filter((x) => x).length + 1, role: mover, j, crossing: m.crossing, tile,
    winning: m.winning, nWinning: nWin, nMoves: ev.moves.length, ms: Date.now() - cur.turnStart,
    hint: !!cur.hintUsedThisMove, rejected: false,
  };
  const trackable = cur.mode === 'winning' || cur.mode === 'choose';
  if (trackable && nWin > 0 && !m.winning) {
    cur.errors++;
    if (cur.strict) {
      event.rejected = true; cur.events.push(event);
      cur.flash = { kind: 'bad', text: `That move hands the win to the ${NAME[other(mover)]}. Look for a different move.` };
      renderBoard(); renderSide();
      return;
    }
  }
  cur.events.push(event);
  cur.flash = trackable && nWin > 0 ? (m.winning ? { kind: 'good', text: 'Good move: you are still winning.' } : { kind: 'bad', text: 'That move lost the winning strategy. The AI can now win.' }) : null;
  applyMove(mover, j, tile, trackable && nWin > 0 ? (m.winning ? ' ✓' : ' ✗') : '');
}

function applyMove(role, j, tile, mark = '') {
  const cur = S.cur;
  cur.assign[j] = tile;
  const x = cur.game.diag.crossings[cur.game.playable[j]];
  cur.last = { r: x.r, c: x.c };
  cur.log.push(describe(role, j, tile, mark));
  cur.showHints = false; cur.hintUsedThisMove = false; cur.turnStart = Date.now();
  if (cur.assign.every((t) => t)) return finish();
  refreshHints(); renderBoard(); renderSide(); maybeAI();
}

function maybeAI() {
  const cur = S.cur;
  if (cur.over) return;
  const mover = moverOf(cur.assign, cur.first);
  if (isHuman(cur, mover)) return;
  cur.aiTimer = setTimeout(() => {
    cur.aiTimer = null;
    if (S.cur !== cur || cur.over) return;
    const m = aiMove(cur.game, cur.assign, cur.first);
    if (cur.mode !== 'watch') cur.flash = null;
    applyMove(mover, m.j, m.tile, m.why === 'trap' ? ' <span class="muted">(trap)</span>' : '');
  }, cur.mode === 'watch' ? 900 : 650);
}

function finish() {
  const cur = S.cur;
  cur.over = true; cur.flash = null; cur.pending = null;
  const final = classifyBoard(currentBoard(cur));
  cur.final = final;
  cur.winner = final.is_unknot ? 'unknotter' : 'knotter';
  refreshHints(); renderBoard(); renderSide();
  if (cur.mode === 'winning' || cur.mode === 'choose') recordGame(cur);
}

// =============================================================================================
// Experiment logging
function recordGame(cur) {
  const e = cur.entry;
  const accepted = cur.events.filter((x) => !x.rejected);
  const rec = {
    v: 1, gameId: cur.gameId, createdAt: new Date().toISOString(), participant: S.label || null,
    boardId: e.id, family: e.family, label: e.label, crossings: cur.game.diag.N, playable: cur.game.n,
    rows: e.rows, cols: e.cols, density: +(cur.game.diag.N / (e.rows * e.cols)).toFixed(4),
    firstPlayer: cur.first, humanRole: cur.humans[0], mode: cur.mode, strict: cur.strict,
    theoreticalWinner: cur.theory, winner: cur.winner, humanWon: cur.winner === cur.humans[0],
    errors: cur.errors, hints: cur.hints, humanMoves: accepted.length,
    optimalMoves: accepted.filter((x) => x.winning || x.nWinning === 0).length,
    medianMoveMs: median(accepted.map((x) => x.ms)), durationMs: Date.now() - cur.t0,
    finalBoard: currentBoard(cur), jones: cur.final.jones_polynomial, events: cur.events,
    initialBoard: e.board,
  };
  S.session.push(rec);
  saveRemote(rec);
}

async function initDB() {
  try {
    if (!window.claude || !window.claude.use) { S.dbStatus = 'unavailable'; return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) { S.dbStatus = 'unavailable'; return; }
    S.db = db; S.user = user;
    S.uid = await user.id();
    try { S.canSeeAll = !!(await user.canEdit()); } catch { S.canSeeAll = false; }
    S.dbStatus = S.uid ? 'connected' : 'unavailable';
  } catch (err) { S.dbStatus = 'unavailable'; S.dbError = String(err && err.message || err); }
  if (location.hash === '#data') viewData();
}

async function saveRemote(rec) {
  if (!S.db || !S.uid) { rec._saved = 'local only'; return; }
  try {
    await S.db.doc(`trials/${S.uid}`).set({ uid: S.uid, participant: S.label || null, lastSeen: rec.createdAt });
    const { initialBoard, finalBoard, ...rest } = rec;
    await S.db.collection(`trials/${S.uid}/games`).doc(rec.gameId).set({ ...rest, initialBoard: JSON.stringify(initialBoard), finalBoard: JSON.stringify(finalBoard), events: JSON.stringify(rec.events) });
    rec._saved = 'saved';
  } catch (err) { rec._saved = 'save failed: ' + (err && err.message || err); }
  if (location.hash === '#data') viewData();
}

async function loadRemote() {
  if (!S.db) return;
  S.remote = { loading: true, rows: [] };
  viewData();
  const rows = [];
  let scope = 'everyone';
  try {
    let people = [];
    if (S.canSeeAll) { try { people = (await S.db.collection('trials').get()).docs || []; } catch { people = []; } }
    if (!S.canSeeAll) scope = 'you';
    const ids = people.map((p) => p.id).filter(Boolean);
    if (!ids.includes(S.uid)) ids.push(S.uid);
    for (const id of ids) {
      try {
        const snap = await S.db.collection(`trials/${id}/games`).get();
        for (const d of snap.docs || []) { const x = typeof d.data === 'function' ? d.data() : d.data; if (x) rows.push({ ...x, events: safeJSON(x.events, []) , uid: id }); }
      } catch { /* not readable */ }
    }
    S.remote = { loading: false, rows, scope };
  } catch (err) { S.remote = { loading: false, rows, scope, error: String(err && err.message || err) }; }
  viewData();
}
function safeJSON(s, d) { try { return typeof s === 'string' ? JSON.parse(s) : (s || d); } catch { return d; } }

// Atlas
function viewAtlas() {
  const rows = S.catalog.map((e) => ({ e, a: analysisOf(e) })).filter((x) => x.a.ok);
  const count = (f) => rows.filter(f).length;
  const famStats = FAMILIES.slice(1).map((f) => {
    const rs = rows.filter((x) => x.e.family === f);
    return { f, n: rs.length, matters: rs.filter((x) => x.a.firstMoverMatters).length, kAlways: rs.filter((x) => x.a.winnerIfKnotterFirst === 'knotter' && x.a.winnerIfUnknotterFirst === 'knotter').length, uAlways: rs.filter((x) => x.a.winnerIfKnotterFirst === 'unknotter' && x.a.winnerIfUnknotterFirst === 'unknotter').length };
  });
  const share = (v) => v == null ? '<span class="muted">—</span>' : pct(v);
  $('#app').innerHTML = `
    <h1>First-mover atlas</h1>
    <p class="lede">Every shadow in the catalog is solved exactly (minimax over all ${'3ⁿ'} game states, with every finished diagram classified by its Jones polynomial). This answers <i>does it matter who goes first?</i> board by board, and says which side to hand to the human.</p>
    <div class="stat2" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="stat"><div class="l">Shadows solved</div><div class="v">${rows.length}</div></div>
      <div class="stat"><div class="l">Unknotter always wins</div><div class="v">${count((x) => x.a.winnerIfKnotterFirst === 'unknotter' && x.a.winnerIfUnknotterFirst === 'unknotter')}</div></div>
      <div class="stat"><div class="l">Knotter always wins</div><div class="v">${count((x) => x.a.winnerIfKnotterFirst === 'knotter' && x.a.winnerIfUnknotterFirst === 'knotter')}</div></div>
      <div class="stat"><div class="l">First mover decides</div><div class="v">${count((x) => x.a.firstMoverMatters)}</div></div>
    </div>
    <div class="card pad" style="margin-bottom:16px"><h2 style="font-size:1.15rem;margin-bottom:8px">By family</h2>
      <table><thead><tr><th>Family</th><th>Shadows</th><th>Unknotter always</th><th>Knotter always</th><th>First mover decides</th></tr></thead><tbody>
      ${famStats.map((s) => `<tr><td><b>${esc(s.f)}</b></td><td>${s.n}</td><td>${s.uAlways}</td><td>${s.kAlways}</td><td>${s.matters}</td></tr>`).join('')}</tbody></table></div>

      ${rows.map(({ e, a }) => `<tr class="click" data-id="${e.id}"><td><b>${esc(e.label)}</b>${e.knot ? `<div class="muted">${esc(e.knot)}</div>` : ''}</td><td>${esc(e.family)}</td><td>${e.crossings}</td><td>${a.density.toFixed(2)}</td>
        <td><span class="pill ${a.winnerIfKnotterFirst === 'knotter' ? 'k' : 'u'}">${NAME[a.winnerIfKnotterFirst]}</span></td>

  $('#app').querySelectorAll('tr[data-id]').forEach((tr) => tr.onclick = () => openBoard(tr.dataset.id));
}

function toCSV(objs) {
  if (!objs.length) return '';
  const keys = [...new Set(objs.flatMap((o) => Object.keys(o)))];
  const cell = (v) => { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [keys.join(','), ...objs.map((o) => keys.map((k) => cell(o[k])).join(','))].join('\n');
}

// =============================================================================================
// 3D view (three.js from cdnjs; loaded on first use)
let threeLoading = null;
function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  if (!threeLoading) threeLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = () => res(window.THREE); s.onerror = () => rej(new Error('Could not load three.js'));
    document.head.appendChild(s);
  });
  return threeLoading;
}

function knotPoints3D(board) {
  const d = buildDiagram(board);
  if (!d.path) return null;
  const pts = [], zs = [], flags = [];
  const P = (r, c, px, py) => [c + px - d.C / 2, -(r + py - d.R / 2)];
  for (const s of d.path) {
    const [ax, ay] = MID[s.entry], [bx, by] = MID[s.exit];
    if (s.crossing !== undefined) {
      const tile = board[s.r][s.c];
      const horiz = s.exit === 1 || s.exit === 3;
      const z = tile === -1 ? 0 : ((tile === 9) === horiz ? 1 : -1);
      for (let k = 0; k < 6; k++) { const u = k / 6; pts.push(P(s.r, s.c, ax + (bx - ax) * u, ay + (by - ay) * u)); zs.push(z); flags.push(tile === -1 ? 1 : 0); }
    } else {
      const straight = (s.entry + 2) % 4 === s.exit;
      for (let k = 0; k < 6; k++) {
        const u = k / 6;
        const px = straight ? ax + (bx - ax) * u : (1 - u) * (1 - u) * ax + 2 * u * (1 - u) * 0.5 + u * u * bx;
        const py = straight ? ay + (by - ay) * u : (1 - u) * (1 - u) * ay + 2 * u * (1 - u) * 0.5 + u * u * by;
        pts.push(P(s.r, s.c, px, py)); zs.push(0); flags.push(0);
      }
    }
  }
  // smooth heights along the closed curve
  const n = pts.length, rad = 7, out = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    let s = 0, w = 0;
    for (let k = -rad * 2; k <= rad * 2; k++) { const ww = Math.exp(-(k * k) / (2 * rad * rad)); s += zs[(i + k + n) % n] * ww; w += ww; }
    out[i] = (s / w) * 1.1;
  }
  const unresolved = d.crossings.filter((x) => board[x.r][x.c] === -1).map((x) => P(x.r, x.c, 0.5, 0.5));
  return { pts: pts.map((p, i) => [p[0], p[1], out[i]]), unresolved, size: Math.max(d.R, d.C) };
}

async function open3D(board) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal" id="m3"><div class="card pad" style="gap:10px">
    <div class="row" style="justify-content:space-between"><h2>3D view</h2><div class="row"><span class="muted">Drag to rotate · scroll to zoom</span><button class="btn small" id="m3x">Close</button></div></div>
    <canvas id="c3"></canvas><div class="muted" id="m3msg">Color runs once around the knot so you can follow the strand. Gold spheres mark crossings not yet resolved.</div></div></div>`;
  let alive = true, raf = 0;
  const close = () => { alive = false; cancelAnimationFrame(raf); root.innerHTML = ''; };
  $('#m3x').onclick = close; $('#m3').onclick = (e) => { if (e.target.id === 'm3') close(); };
  const data = knotPoints3D(board);
  if (!data) { $('#m3msg').textContent = 'Only single-component knot diagrams can be shown in 3D.'; return; }
  let THREE;
  try { THREE = await loadThree(); } catch (err) { THREE = null; }
  if (!alive) return;
  const canvas = $('#c3');
  if (!THREE) { canvasTube(canvas, data, () => alive, (id) => { raf = id; }); return; }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
  let dist = data.size * 1.9; camera.position.set(0, 0, dist);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dl = new THREE.DirectionalLight(0xffffff, 0.75); dl.position.set(4, 6, 10); scene.add(dl);
  const group = new THREE.Group(); scene.add(group);
  const curve = new THREE.CatmullRomCurve3(data.pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])), true, 'centripetal');
  const segs = Math.min(2400, data.pts.length * 4), radial = 12;
  const geo = new THREE.TubeGeometry(curve, segs, 0.13, radial, true);
  const colors = [], col = new THREE.Color();
  for (let i = 0; i <= segs; i++) { col.setHSL(0.58 + 0.35 * (i / segs), 0.45, 0.42); for (let j = 0; j <= radial; j++) colors.push(col.r, col.g, col.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.45, metalness: 0.1 })));
  for (const [x, y] of data.unresolved) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 16), new THREE.MeshStandardMaterial({ color: 0xbfcc94, emissive: 0x3f4a1b, roughness: 0.4 }));
    s.position.set(x, y, 0); group.add(s);
  }
  group.rotation.x = -0.45;
  let drag = null, auto = true;
  canvas.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, rx: group.rotation.x, ry: group.rotation.y }; auto = false; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = (e) => { if (!drag) return; group.rotation.y = drag.ry + (e.clientX - drag.x) * 0.01; group.rotation.x = drag.rx + (e.clientY - drag.y) * 0.01; };
  canvas.onpointerup = () => { drag = null; };
  canvas.onwheel = (e) => { e.preventDefault(); dist = Math.max(data.size * 0.6, Math.min(data.size * 5, dist * (1 + Math.sign(e.deltaY) * 0.08))); camera.position.z = dist; };
  const resize = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  resize();
  const tick = () => { if (!alive) return; if (canvas.clientWidth && Math.abs(canvas.width - canvas.clientWidth * renderer.getPixelRatio()) > 2) resize(); if (auto) group.rotation.y += 0.006; renderer.render(scene, camera); raf = requestAnimationFrame(tick); };
  tick();
}

// Dependency-free fallback: painter's-algorithm tube on a 2D canvas
function canvasTube(canvas, data, isAlive, setRaf) {
  const ctx = canvas.getContext('2d');
  const pts = data.pts, n = pts.length;
  let rx = -0.45, ry = 0, auto = true, drag = null, zoom = 1;
  canvas.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, rx, ry }; auto = false; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = (e) => { if (!drag) return; ry = drag.ry + (e.clientX - drag.x) * 0.01; rx = drag.rx + (e.clientY - drag.y) * 0.01; };
  canvas.onpointerup = () => { drag = null; };
  canvas.onwheel = (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(3, zoom * (1 - Math.sign(e.deltaY) * 0.08))); };
  const frame = () => {
    if (!isAlive()) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    if (auto) ry += 0.006;
    const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    const scale = Math.min(w, h) / (data.size * 1.25) * zoom, camD = data.size * 2.2;
    const proj = ([x, y, z]) => { const x1 = x * cy + z * sy, z1 = -x * sy + z * cy; const y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx; const p = camD / (camD - z2); return [w / 2 + x1 * scale * p, h / 2 - y2 * scale * p, z2, p]; };
    const P = pts.map(proj);
    const segs = [];
    for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; segs.push({ a, b, z: (a[2] + b[2]) / 2, t: i / n }); }
    segs.sort((u, v) => u.z - v.z);
    ctx.lineCap = 'round';
    for (const s of segs) {
      const width = 0.26 * scale * (s.a[3] + s.b[3]) / 2, light = 34 + 12 * Math.max(-1, Math.min(1, s.z / 1.2));
      ctx.lineCap = 'butt'; ctx.strokeStyle = 'rgba(13,24,33,.85)'; ctx.lineWidth = width + 2.2; ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke();
      ctx.lineCap = 'round'; ctx.strokeStyle = `hsl(${Math.round(210 + 126 * s.t)},45%,${light}%)`; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke();
    }
    for (const [x, y] of data.unresolved) { const q = proj([x, y, 0]); ctx.fillStyle = '#bfcc94'; ctx.strokeStyle = '#3f4a1b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(q[0], q[1], 0.24 * scale * q[3], 0, 7); ctx.fill(); ctx.stroke(); }
    setRaf(requestAnimationFrame(frame));
  };
  frame();
}
